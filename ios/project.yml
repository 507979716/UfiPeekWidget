name: UfiPeek
options:
  bundleIdPrefix: com.ufipeek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  UfiPeek:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: UfiPeek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 需要访问局域网内的随身 WiFi（UFI-TOOLS 后台）以读取流量、电量等状态。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/UfiPeek.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ufipeek.widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ufipeek.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: UfiPeekWidget
        embed: true
  UfiPeekWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: UfiPeek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: 允许小组件读取局域网内的 UFI-TOOLS 设备状态。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: Widget/UfiPeekWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ufipeek.widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ufipeek.app.widget
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  UfiPeek:
    build:
      targets:
        UfiPeek: all
        UfiPeekWidget: all
    run:
      config: Debug
    archive:
      config: Release
